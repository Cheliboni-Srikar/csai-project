<title id="title">A valid plan checks preconditions in order</title>
<rect width="100%" height="100%" fill="white"/>
<text x="400.0" y="43" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#222222">A valid plan checks preconditions in order</text>
<rect x="15" y="96" width="225" height="123" rx="8" fill="#f0f0f0"/>
<text x="127.5" y="129" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#222222">Start</text>
